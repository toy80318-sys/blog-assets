<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>토이블록 업데이트</title>
<style>
  :root { --g: #03a94d; --line: #e3e6ea; --sub: #6b7280; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #f5f6f8; color: #1f2328; font: 14px/1.6 -apple-system, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
  .wrap { max-width: 560px; margin: 32px auto; background: #fff; border-radius: 16px; padding: 28px 30px; box-shadow: 0 2px 12px rgba(0,0,0,.05); }
  .brand { color: var(--g); font-weight: 700; font-size: 13px; }
  h1 { font-size: 22px; margin: 2px 0 6px; }
  .ver { color: var(--sub); margin: 0 0 16px; }
  .notes { white-space: pre-line; background: #fafbfc; border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; font-size: 13px; color: #3d4550; margin: 0 0 16px; display: none; }
  .go { width: 100%; padding: 14px; border-radius: 12px; border: 0; background: var(--g); color: #fff; font: inherit; font-size: 16px; font-weight: 700; cursor: pointer; }
  .go:disabled { opacity: .55; cursor: default; }
  .first { font-size: 13px; color: #3d4550; background: #f4f8fe; border-left: 4px solid #1a73e8; border-radius: 6px; padding: 10px 12px; margin: 12px 0 0; display: none; }
  ol.steps { list-style: none; padding: 0; margin: 18px 0 0; }
  ol.steps li { display: flex; gap: 10px; align-items: baseline; padding: 6px 0; border-bottom: 1px dashed var(--line); color: #9aa3ae; }
  ol.steps li i { font-style: normal; width: 18px; text-align: center; }
  ol.steps li.run { color: #1f2328; } ol.steps li.ok { color: #027a38; } ol.steps li.err { color: #c62828; }
  ol.steps li small { margin-left: auto; color: var(--sub); }
  .msg { margin-top: 14px; font-size: 13.5px; min-height: 20px; }
  .msg.ok { color: #027a38; font-weight: 700; } .msg.err { color: #c62828; }
  .done { text-align: center; padding: 10px 0 4px; }
  .done b { display: block; font-size: 20px; color: #027a38; margin-bottom: 6px; }
  .links { margin-top: 18px; font-size: 12.5px; color: var(--sub); display: flex; gap: 14px; flex-wrap: wrap; }
  .links a, .links button { color: #027a38; background: none; border: 0; padding: 0; font: inherit; cursor: pointer; text-decoration: underline; }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">토이블록 네이버 블로그 도우미</div>
  <h1 id="title">업데이트</h1>
  <p class="ver" id="ver">확인 중…</p>
  <div id="doneBox" class="done" style="display:none"><b id="doneTitle"></b><span>열려 있는 블로그 탭에도 새로고침 없이 반영됐어요.</span></div>
  <div class="notes" id="notes"></div>
  <button class="go" id="go" disabled>지금 업데이트</button>
  <p class="first" id="first">처음 한 번만 <b>토이블록을 설치한 폴더</b>를 골라 주세요(설치할 때 압축을 푼 폴더 안의 <b>nbx</b> 폴더). 크롬이 "파일 수정 허용"을 물으면 <b>허용</b>을 눌러 주세요. 다음부터는 이 버튼만 누르면 바로 업데이트돼요.</p>
  <ol class="steps" id="steps">
    <li data-s="check"><i>·</i>최신 버전 확인<small></small></li>
    <li data-s="folder"><i>·</i>설치 폴더 확인<small></small></li>
    <li data-s="download"><i>·</i>새 파일 받기 · 지문 확인<small></small></li>
    <li data-s="write"><i>·</i>새 파일로 바꿔 넣기<small></small></li>
    <li data-s="reload"><i>·</i>바로 적용<small></small></li>
  </ol>
  <div class="msg" id="msg"></div>
  <div class="links"><button type="button" id="relink">설치 폴더 다시 고르기</button><a id="zip" target="_blank" rel="noopener">zip으로 직접 받기</a><a href="options.html#move">설정 · 백업</a></div>
</div>
<script src="selfupdate.js"></script>
<script src="update.js"></script>
</body>
</html>
